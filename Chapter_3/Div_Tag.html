<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Div Tag => Div is a container used for other HTML elements (non-semantic)-->
     <div><p>hello world</p></div>
     <!--Block Elements(takes full width) -->
     <!--Inline Elements(take only required not take extra space)-->
     <div>
        <p>hello world</p>
        <p>namaste</p>
        <p>hi</p>
    </div>

    <div>
        <p>bye</p>
        <p>goodbye</p>
        <p>ciao</p>
    </div>
</body>
</html>
