<!DOCTYPE html>
<html>
<head>
<title>My First Website</title>

<style>
header{
    background-color: lightblue;
    padding: 15px;
    text-align: center;
}

#clock{
    font-size: 24px;
    font-weight: bold;
}
</style>

<script>
function showTime(){
    let date = new Date();
    let time = date.toLocaleTimeString();
    document.getElementById("clock").innerHTML = time;
}

setInterval(showTime,1000);
</script>

</head>

<body onload="showTime()">

<header>
<h1>Welcome to My Website</h1>
<div id="clock"></div>
</header>

<h2>Useful Links</h2>

<ul>
<li><a href="https://www.google.com" target="_blank">Open Google</a></li>
<li><a href="https://www.facebook.com" target="_blank">Open Facebook</a></li>
<li><a href="https://www.youtube.com" target="_blank">Open YouTube</a></li>
</ul>

<hr>

<h2>About This Page</h2>
<p>This page is created using basic HTML and a JavaScript clock.</p>

</body>
</html>
